# Docker Compose for GPU Service only
version: '3.8'

services:
  gpu-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    container_name: violence-gpu-worker
    runtime: nvidia  # Use nvidia runtime instead of gpus: all
    ports:
      - "8001:8001"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET}
      - API_KEY=${API_KEY}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ../.env:/app/.env:ro
      - ../violence_detection_v4.pt:/app/violence_detection_v4.pt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s