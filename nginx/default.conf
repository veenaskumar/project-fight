# nginx.conf for Streamlit + Cloudflare Origin SSL
server {
    listen 443 ssl;
    server_name app.nightshield.ai;

    # SSL certificate and key (Cloudflare Origin Certificate)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/night.key;

    # Recommended SSL settings
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        # Proxy pass to your Streamlit container
        proxy_pass http://frontend:8080;

        # Preserve host and client IP
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Streamlit uses WebSockets)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /video/ {
    	proxy_pass http://18.134.20.221:8001/;
    	proxy_set_header Host $host;
    	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    	proxy_set_header X-Forwarded-Proto $scheme;

    	proxy_http_version 1.1;
    	proxy_set_header Upgrade $http_upgrade;
    	proxy_set_header Connection "upgrade";
    }

}

# Optional: redirect HTTP to HTTPS
server {
    listen 80;
    server_name app.nightshield.ai;
    return 301 https://$host$request_uri;
}
